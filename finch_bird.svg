    <!-- Body (main, bright) -->
    <path d="M710,236 L742,284 L778,300 L812,312 Q808,382 735,398 Q700,406 662,405 Z" fill="#12C4AA"/>

    <!-- Neck collar -->
    <path d="M738,284 L778,300 L760,312 L742,296 Z" fill="#12C4AA"/>

