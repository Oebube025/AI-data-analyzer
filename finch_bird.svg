    <polyline points="750,298 773,321 912,181" fill="none" stroke="#EFA94E" stroke-width="27" stroke-linejoin="miter" stroke-linecap="butt"/>

    <!-- Arrowhead -->
    <path d="M937,150 L882,163 L922,204 Z" fill="#EFA94E"/>
